name: Build report

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-recommended

      - name: Compile report
        run: latexmk -cd -pdf -Werror -interaction=nonstopmode -halt-on-error -outdir=build report/main.tex

      - uses: actions/upload-artifact@v6
        with:
          name: report-pdf
          path: report/build/main.pdf
          if-no-files-found: error
